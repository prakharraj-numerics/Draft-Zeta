name: Derive zeta term rule
on:
  push:
    paths:
      - derive_term_rule.cpp
      - .github/workflows/derive-term-rule.yml
  workflow_dispatch:
jobs:
  derive:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install FLINT
        run: |
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f \( -iname '*microsoft*' -o -iname '*azure*' \) -delete || true
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libflint-dev
      - name: Build
        run: g++ -O3 -std=c++20 derive_term_rule.cpp -lflint -lmpfr -lgmp -lm -o derive_term_rule
      - name: Derive
        run: ./derive_term_rule 2>&1 | tee term_rule_map.txt
      - uses: actions/upload-artifact@v4
        with:
          name: term-rule-map
          path: term_rule_map.txt