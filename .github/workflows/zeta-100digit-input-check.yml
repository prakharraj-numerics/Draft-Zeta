name: Zeta 100-digit input accuracy check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'test_zeta_100digit_input.cpp'
      - '.github/workflows/zeta-100digit-input-check.yml'

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install FLINT 3 and Boost
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libflint-dev libboost1.83-dev
          dpkg-query -W libflint-dev libboost1.83-dev
      - name: Build
        run: |
          g++ -O3 -DNDEBUG -std=c++20 -march=native -fno-fast-math -ffp-contract=off \
            test_zeta_100digit_input.cpp -lflint -lmpfr -lgmp -o test_zeta_100digit_input
      - name: Run exact-input check
        run: |
          ./test_zeta_100digit_input | tee zeta_100digit_input_result.txt
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zeta-100digit-input-result
          path: zeta_100digit_input_result.txt
