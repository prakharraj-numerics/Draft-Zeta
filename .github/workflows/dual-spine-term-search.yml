name: Dual spine term search
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'find_dual_spine_terms.c'
      - '.github/workflows/dual-spine-term-search.yml'
jobs:
  search:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install FLINT 3
        run: |
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f \( -iname '*microsoft*' -o -iname '*azure*' \) -delete || true
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libflint-dev
      - name: Build
        run: |
          cc -O3 -std=c11 find_dual_spine_terms.c -lflint -lmpfr -lgmp -lm -o find_dual
      - name: Search and verify
        run: |
          ./find_dual 2>&1 | tee result.txt
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: dual-spine-result
          path: result.txt
