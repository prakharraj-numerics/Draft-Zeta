name: Apple M1 zeta benchmark

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'bench_apple_m1_boost_zeta.cpp'
      - '.github/workflows/apple-m1-zeta-benchmark.yml'

jobs:
  apple-m1-zeta:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Identify Apple silicon runner
        run: |
          echo '=== uname ==='
          uname -a
          uname -m
          echo '=== CPU ==='
          sysctl -n machdep.cpu.brand_string || true
          sysctl -n hw.physicalcpu || true
          sysctl -n hw.logicalcpu || true
          system_profiler SPHardwareDataType || true
          echo '=== compiler ==='
          clang++ --version

      - name: Install Boost 1.83 headers
        run: |
          curl -L --fail --retry 3 \
            https://archives.boost.io/release/1.83.0/source/boost_1_83_0.tar.bz2 \
            -o /tmp/boost_1_83_0.tar.bz2
          tar -xjf /tmp/boost_1_83_0.tar.bz2 -C /tmp
          test -f /tmp/boost_1_83_0/boost/math/special_functions/zeta.hpp
          echo 'BOOST_VERSION=1.83.0'

      - name: Build benchmark
        run: |
          clang++ -O3 -DNDEBUG -std=c++20 -mcpu=native -fno-fast-math -ffp-contract=off \
            -I/tmp/boost_1_83_0 \
            bench_apple_m1_boost_zeta.cpp -o bench_apple_m1_boost_zeta

      - name: Benchmark zeta on M1
        run: |
          ./bench_apple_m1_boost_zeta | tee apple_m1_zeta_results.txt

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-m1-zeta-results
          path: apple_m1_zeta_results.txt
