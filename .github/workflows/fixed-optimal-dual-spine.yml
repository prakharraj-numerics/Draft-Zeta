name: Fixed optimal dual spine
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'fixed_optimal_dual_spine.cpp'
      - '.github/workflows/fixed-optimal-dual-spine.yml'

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install FLINT
        run: |
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f \( -iname '*microsoft*' -o -iname '*azure*' \) -delete || true
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libflint-dev
      - name: Build
        run: g++ -O3 -std=c++20 fixed_optimal_dual_spine.cpp -lflint -lmpfr -lgmp -lm -o fixed_optimal
      - name: Search mathematical minima and verify fixed DD counts
        run: ./fixed_optimal 2>&1 | tee result.txt
      - uses: actions/upload-artifact@v4
        with:
          name: fixed-optimal-dual-spine-result
          path: result.txt
