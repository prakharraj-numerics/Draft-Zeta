name: Forward Horner check
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'compare_forward_horner.c'
      - '.github/workflows/forward-horner-check.yml'
jobs:
  check:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f \( -iname '*microsoft*' -o -iname '*azure*' \) -delete || true
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libflint-dev
      - run: cc -O3 -std=c11 compare_forward_horner.c -lflint -lmpfr -lgmp -lm -o compare
      - run: ./compare | tee result.txt
      - uses: actions/upload-artifact@v4
        with:
          name: forward-horner-result
          path: result.txt
