name: Dual truncation search
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'find_dual_truncation_terms.c'
      - '.github/workflows/dual-truncation-search.yml'
jobs:
  search:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f \( -iname '*microsoft*' -o -iname '*azure*' \) -delete || true
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libflint-dev
      - run: cc -O3 -std=c11 find_dual_truncation_terms.c -lflint -lmpfr -lgmp -lm -o find_terms
      - run: ./find_terms 2>&1 | tee result.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dual-truncation-result
          path: result.txt
