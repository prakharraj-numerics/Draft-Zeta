name: Adaptive random 5000
on:
  push:
    paths:
      - zeta53_adaptive_random5000.cpp
      - .github/workflows/adaptive-random5000.yml
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install FLINT
        run: |
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f \( -iname '*microsoft*' -o -iname '*azure*' \) -delete || true
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libflint-dev
      - name: Build
        run: g++ -O3 -std=c++20 zeta53_adaptive_random5000.cpp -lflint -lmpfr -lgmp -lm -o adaptive_random5000
      - name: Verify exactly 5000 random inputs
        run: ./adaptive_random5000 2>&1 | tee adaptive_random5000.txt
      - uses: actions/upload-artifact@v4
        with:
          name: adaptive-random5000
          path: adaptive_random5000.txt