name: Zeta53 emit static local9 table
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'zeta53_emit_local9.cpp'
      - '.github/workflows/zeta53-emit-local9.yml'

permissions:
  contents: write

jobs:
  emit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f \( -iname '*microsoft*' -o -iname '*azure*' \) -delete || true
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libflint-dev
      - name: Build generator
        run: |
          g++ -O2 -march=x86-64 -mtune=generic \
              -std=c++20 -DNDEBUG -fno-fast-math -ffp-contract=off \
              zeta53_emit_local9.cpp -lflint -lmpfr -lgmp -lm -o emit_local9
      - name: Generate exact static table
        run: ./emit_local9 > zeta53_local9_table.h
      - name: Commit generated header
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add zeta53_local9_table.h
          if git diff --cached --quiet; then
            echo "static table unchanged"
          else
            git commit -m "add generated static degree-9 local zeta table"
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: zeta53-local9-static-table
          path: zeta53_local9_table.h
